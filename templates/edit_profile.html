
{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <h2 class="mb-4">✏️ Edit Profile</h2>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">

                        <label class="form-label">
                            {{ field.label }}
                        </label>

                        <div>
                            {{ field }}
                        </div>

                        {% if field.errors %}
                            <div class="text-danger small">
                                {{ field.errors }}
                            </div>
                        {% endif %}

                    </div>
                {% endfor %}

                <button type="submit"
                        class="btn btn-success">
                    Save Changes
                </button>

                <a href="{% url 'profile' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
