
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Egg Farm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #173b31, #3c896b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        .login-title {
            text-align: center;
            color: #173b31;
            margin-bottom: 30px;
        }

        .login-btn {
            background: #176044;
            color: white;
            width: 100%;
        }

        .login-btn:hover {
            background: #104d35;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="login-title">
        <h1>🥚</h1>
        <h3>Smart Egg Farm</h3>
        <p class="text-muted">Login to your dashboard</p>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger">
            Invalid username or password.
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter username"
                autocomplete="username"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >
        </div>

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <button type="submit" class="btn login-btn py-2">
            Login
        </button>
        <div class="text-center mt-3">
    <a href="{% url 'password_reset' %}">
        Forgot Password?
    </a>
</div>

    </form>
 <p class="text-center mt-3 mb-0">
    Don't have an account?
    <a href="{% url 'register' %}">
        Register here
    </a>
</p>   

</div>

</body>
</html>
