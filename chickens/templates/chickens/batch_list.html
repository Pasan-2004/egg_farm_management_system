<!DOCTYPE html>
<html>
<head>
    <title>Chicken Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">

    <h2>🐔 Chicken Management</h2>

    <a href="{% url 'add_batch' %}"
       class="btn btn-success my-3">
        + Add Chicken Batch
    </a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Batch Name</th>
                <th>Breed</th>
                <th>Quantity</th>
                <th>Age (Weeks)</th>
                <th>Arrival Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for batch in batches %}
            <tr>
                <td>{{ batch.batch_name }}</td>
                <td>{{ batch.breed }}</td>
                <td>{{ batch.quantity }}</td>
                <td>{{ batch.age_weeks }}</td>
                <td>{{ batch.arrival_date }}</td>

                <td>
                    <a href="{% url 'edit_batch' batch.id %}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="{% url 'delete_batch' batch.id %}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="6" class="text-center">
                    No chicken batches found.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
</body>
</html>
