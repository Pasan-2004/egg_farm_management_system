
{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <h2 class="fw-bold mb-4">
        🛒 Place Egg Order
    </h2>

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h5 class="text-success">
                🥚 Available Eggs: {{ available_eggs }}
            </h5>

            <hr>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-success"
                    {% if available_eggs == 0 %}disabled{% endif %}>
                    Place Order
                </button>

            </form>

        </div>

    </div>

</div>
<div class="alert alert-info">
    🥚 Price per Egg:
    <strong>Rs. {{ egg_price|floatformat:2 }}</strong>
</div>
{% endblock %}
